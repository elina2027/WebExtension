<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Ctrl+F</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #e0e0e0;
        }

        .container {
            background-color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="text"],
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 180px;
        }

        input[type="number"] {
            width: 60px; /* Reduced width for gap input */
        }

        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        .highlighted {
            background-color: #ffeb3b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="word1" placeholder="Word 1">
        <input type="number" id="charGap" placeholder="Gap" min="0">
        <input type="text" id="word2" placeholder="Word 2">
        <button id="search">Search</button>
        <button id="clear">Clear</button>
    </div>

    <script src="popup.js"></script>

</body>
</html>
